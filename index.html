<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant & Soil Expert System V23.0</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --neon: #39FF14; --bg: #0a0a0a; --panel: #151515; --text: #eee; --glow: 0 0 20px rgba(57, 255, 20, 0.6); }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .main-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .upload-zone { background: #1a1a1a; border: 2px dashed var(--neon); padding: 15px; text-align: center; border-radius: 15px; }
        .control-panel { background: var(--panel); padding: 20px; border-radius: 15px; border: 3px solid var(--neon); box-shadow: var(--glow); display: flex; flex-direction: column; gap: 15px; }
        .search-grid { display: flex; gap: 40px; align-items: flex-start; }
        
        .global-box { flex: 2; position: relative; }
        .global-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; width: 100%; }
        .header-left { display: flex; align-items: center; gap: 30px; flex-grow: 1; }
        
        .checkbox-container { display: flex; gap: 20px; font-size: 0.85rem; color: #aaa; margin-left: 20px; }
        .checkbox-container label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox-container input[type="checkbox"] { cursor: pointer; accent-color: var(--neon); width: auto; padding: 0; }

        .right-box-wrapper { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; gap: 8px; }
        input, select { background: #000; border: 1px solid #444; color: white; padding: 12px; border-radius: 5px; outline: none; }
        input:focus, select:focus { border-color: var(--neon); }
        .attr-input { flex-grow: 1; border: 1px solid var(--neon); font-size: 1rem; }
        .btn-col-help { background: #222; color: var(--neon); border: 1px solid var(--neon); padding: 0 15px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        
        .btn-new-search { background: #ff4444; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 5px; text-transform: uppercase; font-size: 0.8rem; margin-top: 8px; display: inline-block; max-width: max-content; }
        .btn-new-search:hover { background: #cc0000; }
        
        .filters-inline-container { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .dynamic-filters-area { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        
        .filter-tag { background: #222; border: 1px solid var(--neon); padding: 5px 10px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--neon); }
        .filter-tag select { padding: 2px; font-size: 0.75rem; border: none; background: transparent; color: white; cursor: pointer; }
        .filter-tag .remove { color: #ff4444; cursor: pointer; font-weight: bold; margin-left: 5px; }
        
        .counter-badge { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }

        /* Estilos de Ficha Técnica Remodelada */
        #dataSheet { border: 2px solid var(--neon); border-radius: 15px; padding: 25px; margin-bottom: 20px; display: none; box-shadow: var(--glow); position: relative; }
        .sheet-plant { background: #0a0a0a; border-color: var(--neon) !important; }
        .sheet-soil { background: #0c0905; border-color: gold !important; }
        .ds-title-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        .btn-close-sheet { background: #ff4444; color: white; border: none; font-size: 1.2rem; font-weight: bold; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
        .btn-close-sheet:hover { background: #cc0000; transform: scale(1.05); }
        
        .groups-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .info-group-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        .info-group-box h3 { margin-top: 0; color: var(--neon); font-size: 0.9rem; border-bottom: 1px solid #222; padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-box { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #222; font-size: 0.85rem; }
        .info-box:last-child { border-bottom: none; }
        .info-box b { color: #aaa; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
        .info-box span { color: #fff; font-weight: bold; text-align: right; max-width: 60%; word-break: break-word; }
        
        table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
        th { background: #1a1a1a; color: var(--neon); padding: 15px; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid #222; font-size: 0.85rem; }
        tr.data-row:hover { background: #1a2e1a; cursor: pointer; }
        
        .floating-menu { position: absolute; top: 100%; left: 0; width: 100%; background: #111; border: 1px solid var(--neon); z-index: 1000; max-height: 250px; overflow-y: auto; display: none; }
        .menu-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #222; font-size: 0.85rem; }
        .menu-item:hover { background: var(--neon); color: black; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="upload-zone" id="uploadZone">
        <label style="display:block; margin-bottom:10px; color:#aaa; font-size:0.9rem;">Upload files to begin (Plants and inf.xlsx for Soil):</label>
        <input type="file" id="inPlants"> <input type="file" id="inSoil">
    </div>

    <div class="control-panel" id="mainPanel" style="opacity:0.5;">
        <div class="search-grid">
            <div class="global-box">
                <div class="global-header">
                    <div class="header-left">
                        <label style="color:var(--neon); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; white-space: nowrap;">Global Search (Attributes or ?Names)</label>
                        <div class="checkbox-container">
                            <label><input type="checkbox" id="chkSkipRoses" onchange="applyFilters()"> Omitir Rosas</label>
                            <label><input type="checkbox" id="chkSkipFruit" onchange="applyFilters()"> Omitir Fruit Tree</label>
                        </div>
                    </div>
                    <div class="counter-badge" id="counterDisplay">Plants: 0 / 0</div>
                </div>
                
                <div class="input-group">
                    <input type="text" id="attrFinder" class="attr-input" placeholder="Type attributes, use ? separator..." autocomplete="off">
                    <button class="btn-col-help" id="btnHelp" title="Toggle Column Filters">Column +</button>
                </div>
                <div id="attrMenu" class="floating-menu"></div> 
                <div id="colMenu" class="floating-menu"></div> 
                
                <button class="btn-new-search" id="btnNewSearch">New Search</button>
            </div>

            <div class="right-box-wrapper">
                <div style="position:relative;">
                    <label style="color:gold; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px;">Soil Suggestion (inf.xlsx)</label>
                    <input type="text" id="soilFinder" style="width:100%; box-sizing:border-box; border: 1px solid gold;" placeholder="Search soil..." autocomplete="off">
                    <div id="soilMenu" class="floating-menu" style="border-color: gold;"></div>
                </div>
                
                <div style="position:relative;">
                    <label style="color:var(--neon); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px;">Plant Name Search</label>
                    <input type="text" id="plantNameFinder" style="width:100%; box-sizing:border-box; border: 1px solid var(--neon);" placeholder="Direct plant name search..." autocomplete="off">
                    <div id="plantNameMenu" class="floating-menu"></div>
                </div>

                <!-- INTEGRACIÓN: COMBO BOX DE CATEGORÍA DEBAJO DE PLANT NAME SEARCH -->
                <div style="position:relative;">
                    <label style="color:var(--neon); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px;">Plant Category</label>
                    <select id="f-category" style="width:100%; box-sizing:border-box; border: 1px solid var(--neon); background:#000;" onchange="applyFilters();">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="filter-row" style="display:flex; gap:15px; background:#0c0c0c; padding:10px; border-radius:8px; align-items: flex-end; justify-content: space-between;">
            <div class="filters-inline-container">
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <label style="font-size:0.6rem; color:#888; text-transform: uppercase;">Height (ft)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="h-min" min="0" style="width:70px; padding:5px;" placeholder="Min" oninput="validateAndApplyHeight();">
                        <input type="number" id="h-max" min="0" style="width:70px; padding:5px;" placeholder="Max" oninput="validateAndApplyHeight();">
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <label style="font-size:0.6rem; color:#888; text-transform: uppercase;">Light Requirement</label>
                    <select id="f-light" style="padding:5px;" onchange="syncStaticFilterToBox('light', this.value)"><option value="">All Light</option></select>
                </div>
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <label style="font-size:0.6rem; color:#888; text-transform: uppercase;">Foliage</label>
                    <select id="f-foliage" style="padding:5px;" onchange="syncStaticFilterToBox('foliage', this.value)"><option value="">All Foliage</option></select>
                </div>
                
                <div id="dynamicFilters" class="dynamic-filters-area"></div>
            </div>
        </div>
    </div>

    <div id="dataSheet">
        <div class="ds-title-container">
            <h2 id="ds-name" style="margin:0;"></h2>
            <button class="btn-close-sheet" onclick="closeDataSheet()" title="Close Details">×</button>
        </div>
        <div class="groups-wrapper" id="ds-content"></div>
    </div>

    <div class="results-area">
        <table id="mainTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let db = [];
    let soilDb = [];
    let colNames = [];
    let attrSet = new Set();
    let attrToColumnMap = {}; 
    let activeDynamicFilters = {}; 

    let lastSelectedFilters = { light: '', foliage: '' };

    const mappedCols = {
        common_name: 'Common_Name',
        botanical_name: 'Botanical_Name',
        light: 'Light_Requirement',
        foliage: 'Foliage',
        height: 'Height',
        category: 'Category' // Mapeo de la columna Category
    };

    document.getElementById('inPlants').addEventListener('change', (e) => loadXls(e, 'plants'));
    document.getElementById('inSoil').addEventListener('change', (e) => loadXls(e, 'soil'));

    function loadXls(e, type) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            if(type === 'plants') {
                attrSet.clear();
                attrToColumnMap = {};
                db = json.map(r => {
                    let n = {};
                    for (let k in r) {
                        let originalKey = k.trim();
                        n[originalKey] = r[k];
                        if(originalKey !== mappedCols.common_name && originalKey !== mappedCols.botanical_name && r[k] !== undefined && r[k] !== null) {
                            let valStr = String(r[k]).trim();
                            if(valStr.length > 0) {
                                attrSet.add(valStr);
                                attrToColumnMap[valStr.toLowerCase()] = originalKey; 
                            }
                        }
                    }
                    return n;
                });
                colNames = db.length > 0 ? Object.keys(db[0]) : [];
                setupStaticFilters();
                setupCategoryFilter(); // Llenar el combo de categorías
            } else { 
                soilDb = json; 
            }
            
            if(db.length > 0) document.getElementById('mainPanel').style.opacity = "1";
            if(db.length > 0 && soilDb.length > 0) document.getElementById('uploadZone').style.display = 'none';
            applyFilters();
        };
        reader.readAsArrayBuffer(file);
    }

    function setupStaticFilters() {
        ['f-light','f-foliage'].forEach(id => {
            const col = id === 'f-light' ? mappedCols.light : mappedCols.foliage;
            const vals = [...new Set(db.map(p => p[col]))].filter(Boolean).sort();
            const sel = document.getElementById(id);
            const labelWord = id === 'f-light' ? 'Light' : 'Foliage';
            sel.innerHTML = `<option value="">All ${labelWord}</option>`;
            vals.forEach(v => sel.innerHTML += `<option value="${v}">${v}</option>`);
        });
    }

    // Lógica para poblar el combo box de categorías de forma dinámica
    function setupCategoryFilter() {
        const selCategory = document.getElementById('f-category');
        if (!selCategory) return;
        
        // Extraer valores únicos de la columna Category
        const uniqueCategories = [...new Set(db.map(p => p[mappedCols.category]))].filter(Boolean).sort();
        
        selCategory.innerHTML = '<option value="">All Categories</option>';
        uniqueCategories.forEach(cat => {
            selCategory.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    }

    function syncStaticFilterToBox(type, value) {
        let currentText = attrInput.value;
        let lastValue = lastSelectedFilters[type];

        if (lastValue) {
            let escapedLast = escapeRegExp(lastValue);
            let regex = new RegExp('(\\??\\s*' + escapedLast + '\\b|\\b' + escapedLast + '\\b\\s*\\??)', 'gi');
            currentText = currentText.replace(regex, '');
        }

        currentText = currentText.replace(/\?+/g, '?').replace(/\s+/g, ' ').trim();

        if (value) {
            let parts = currentText.split('?').map(p => p.trim()).filter(p => p.length > 0);
            if (!parts.some(p => p.toLowerCase() === value.toLowerCase())) {
                parts.push(value);
            }
            currentText = parts.join('?');
        }

        if(currentText.startsWith('?')) currentText = currentText.substring(1);
        if(currentText.endsWith('?')) currentText = currentText.slice(0, -1);

        attrInput.value = currentText;
        lastSelectedFilters[type] = value;
        applyFilters();
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    document.addEventListener('click', () => { closeAllMenus(); });
    document.addEventListener('keydown', (e) => { if(e.key === "Escape") closeAllMenus(); });
    function closeAllMenus() {
        document.getElementById('attrMenu').style.display = 'none';
        document.getElementById('colMenu').style.display = 'none';
        document.getElementById('soilMenu').style.display = 'none';
        document.getElementById('plantNameMenu').style.display = 'none';
    }

    const hMinInput = document.getElementById('h-min');
    const hMaxInput = document.getElementById('h-max');

    function validateAndApplyHeight() {
        if (hMinInput.value && parseFloat(hMinInput.value) < 0) hMinInput.value = 0;
        if (hMaxInput.value && parseFloat(hMaxInput.value) < 0) hMaxInput.value = 0;
        applyFilters();
    }

    function parseHeightRange(heightStr) {
        if(!heightStr) return { min: 0, max: 0 };
        let str = String(heightStr).toLowerCase().replace(/\s+/g, '');
        let unit = 'ft'; 
        if (str.includes('in') || str.includes('inch')) unit = 'in';
        if (str.includes('ft') || str.includes('\'')) unit = 'ft';
        let cleanStr = str.replace(/[a-z']/g, ''); 
        let rawMin = 0; let rawMax = 0;

        if (cleanStr.includes('-')) {
            let parts = cleanStr.split('-');
            rawMin = parseFloat(parts[0]) || 0;
            rawMax = parseFloat(parts[1]) || rawMin; 
        } else {
            rawMin = parseFloat(cleanStr) || 0; rawMax = rawMin; 
        }
        return { min: (unit === 'ft') ? rawMin * 12 : rawMin, max: (unit === 'ft') ? rawMax * 12 : rawMax };
    }

    function clearInputsExcept(activeInputId) {
        if(activeInputId !== 'attrFinder') {
            attrInput.value = "";
            lastSelectedFilters = { light: '', foliage: '' };
            document.getElementById('f-light').value = "";
            document.getElementById('f-foliage').value = "";
            hMinInput.value = "";
            hMaxInput.value = "";
            document.getElementById('dynamicFilters').innerHTML = "";
            activeDynamicFilters = {};
        }
        if(activeInputId !== 'plantNameFinder') document.getElementById('plantNameFinder').value = "";
        if(activeInputId !== 'soilFinder') document.getElementById('soilFinder').value = "";
    }

    const attrInput = document.getElementById('attrFinder');
    const attrMenu = document.getElementById('attrMenu');
    attrInput.addEventListener('click', (e) => e.stopPropagation());
    
    attrInput.addEventListener('input', () => {
        clearInputsExcept('attrFinder');
        const fullVal = attrInput.value.toLowerCase();
        
        if(lastSelectedFilters.light && !fullVal.includes(lastSelectedFilters.light.toLowerCase())) {
            document.getElementById('f-light').value = "";
            lastSelectedFilters.light = "";
        }
        if(lastSelectedFilters.foliage && !fullVal.includes(lastSelectedFilters.foliage.toLowerCase())) {
            document.getElementById('f-foliage').value = "";
            lastSelectedFilters.foliage = "";
        }

        for(let col in activeDynamicFilters) {
            let linkedTag = document.getElementById(`tag-container-${col.replace(/ /g, '_')}`);
            if(linkedTag) {
                let word = linkedTag.dataset.linkedWord.toLowerCase();
                if(word && !fullVal.includes(word)) {
                    delete activeDynamicFilters[col];
                    linkedTag.remove();
                }
            }
        }

        const normalizedVal = fullVal.replace(/\?/g, ' ');
        const parts = normalizedVal.split(/\s+/);
        let lastPart = parts[parts.length-1].trim();

        if(lastPart.length > 0) {
            if(attrToColumnMap[lastPart]) { autoTriggerDynamicFilter(attrToColumnMap[lastPart], lastPart); }
            const matches = Array.from(attrSet).filter(a => {
                const lowerA = a.toLowerCase();
                return lowerA.includes(lastPart) && !normalizedVal.includes(lowerA);
            }).slice(0, 8);

            attrMenu.innerHTML = matches.map(m => `<div class="menu-item s-suggestion" data-val="${m}">${m}</div>`).join('');
            attrMenu.style.display = matches.length ? 'block' : 'none';
        } else { attrMenu.style.display = 'none'; }
        applyFilters();
    });

    const soilInput = document.getElementById('soilFinder');
    const soilMenu = document.getElementById('soilMenu');
    soilInput.addEventListener('click', (e) => e.stopPropagation());
    soilInput.addEventListener('input', () => {
        clearInputsExcept('soilFinder');
        const val = soilInput.value.toLowerCase().trim();
        if(val.length > 0 && soilDb.length > 0) {
            const firstCol = Object.keys(soilDb[0])[0];
            const matches = soilDb.filter(s => String(s[firstCol] || '').toLowerCase().includes(val)).slice(0, 8);
            
            soilMenu.innerHTML = matches.map(s => {
                let display = s[firstCol];
                return `<div class="menu-item soil-opt-item" data-val="${display}">${display}</div>`;
            }).join('');
            soilMenu.style.display = matches.length ? 'block' : 'none';
        } else { soilMenu.style.display = 'none'; }
    });

    const plantNameInput = document.getElementById('plantNameFinder');
    const plantNameMenu = document.getElementById('plantNameMenu');
    plantNameInput.addEventListener('click', (e) => e.stopPropagation());
    plantNameInput.addEventListener('input', () => {
        clearInputsExcept('plantNameFinder');
        const val = plantNameInput.value.toLowerCase().trim();
        if(val.length > 0 && db.length > 0) {
            const matches = db.filter(p => 
                (p[mappedCols.common_name] || '').toLowerCase().includes(val) || 
                (p[mappedCols.botanical_name] || '').toLowerCase().includes(val)
            ).slice(0, 8);
            plantNameMenu.innerHTML = matches.map(p => {
                let display = p[mappedCols.common_name] || p[mappedCols.botanical_name];
                return `<div class="menu-item plant-suggestion" data-val="${display}">${display}</div>`;
            }).join('');
            plantNameMenu.style.display = matches.length ? 'block' : 'none';
        } else { plantNameMenu.style.display = 'none'; }
        applyFilters();
    });

    function autoTriggerDynamicFilter(col, value) {
        if(col === mappedCols.light) {
            let select = document.getElementById('f-light');
            let option = Array.from(select.options).find(o => o.value.toLowerCase() === value.toLowerCase());
            if(option) { select.value = option.value; lastSelectedFilters.light = option.value; applyFilters(); return; }
        }
        if(col === mappedCols.foliage) {
            let select = document.getElementById('f-foliage');
            let option = Array.from(select.options).find(o => o.value.toLowerCase() === value.toLowerCase());
            if(option) { select.value = option.value; lastSelectedFilters.foliage = option.value; applyFilters(); return; }
        }
        if(activeDynamicFilters[col] === undefined) { addFilterTag(col, value); }
    }

    document.getElementById('btnHelp').addEventListener('click', (e) => {
        e.stopPropagation();
        const menu = document.getElementById('colMenu');
        menu.innerHTML = colNames.map(c => `<div class="menu-item col-opt" data-col="${c}">${c.replace(/_/g,' ').replace(/([A-Z])/g, ' $1').trim().toUpperCase()}</div>`).join('');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', (e) => {
        if(e.target.classList.contains('s-suggestion')) {
            const val = e.target.dataset.val;
            const targetCol = attrToColumnMap[val.toLowerCase()];
            let rawInput = attrInput.value;
            let lastSpace = rawInput.lastIndexOf(' ');
            let lastQuestion = rawInput.lastIndexOf('?');
            let lastIndex = Math.max(lastSpace, lastQuestion);
            let base = lastIndex !== -1 ? rawInput.substring(0, lastIndex + 1) : '';
            attrInput.value = base + val;
            if(targetCol) { autoTriggerDynamicFilter(targetCol, val); }
            attrMenu.style.display = 'none';
            applyFilters();
        }
        
        if(e.target.classList.contains('soil-opt-item')) {
            const val = e.target.dataset.val;
            soilInput.value = val;
            soilMenu.style.display = 'none';
            document.getElementById('tableBody').innerHTML = "";
            document.getElementById('counterDisplay').innerText = `Plants: 0 / ${db.length}`;
            showDetail(val, 'soil');
        }

        if(e.target.classList.contains('plant-suggestion')) {
            const targetPlantName = e.target.dataset.val;
            attrInput.value = "";
            soilInput.value = "";
            hMinInput.value = "";
            hMaxInput.value = "";
            document.getElementById('f-light').value = "";
            document.getElementById('f-foliage').value = "";
            document.getElementById('f-category').value = ""; // Limpieza del filtro category
            document.getElementById('dynamicFilters').innerHTML = "";
            activeDynamicFilters = {};
            lastSelectedFilters = { light: '', foliage: '' };
            plantNameInput.value = targetPlantName;
            plantNameMenu.style.display = 'none';
            applyFilters();
            showDetail(targetPlantName, 'plant');
        }
        if(e.target.classList.contains('col-opt')) {
            addFilterTag(e.target.dataset.col, "");
            document.getElementById('colMenu').style.display = 'none';
        }
    });

    function addFilterTag(col, initialValue) {
        if(activeDynamicFilters[col] !== undefined) return;
        const vals = [...new Set(db.map(p => p[col]))].filter(Boolean).sort();
        const tag = document.createElement('div');
        tag.className = 'filter-tag';
        tag.id = `tag-container-${col.replace(/ /g, '_')}`;
        tag.dataset.linkedWord = initialValue; 

        tag.innerHTML = `<span>${col.replace(/_/g,' ').toUpperCase()}</span>
            <select id="sel-dyn-${col.replace(/ /g, '_')}" onchange="updateDynFilter('${col}', this.value)">
                <option value="">Any</option>
                ${vals.map(v => {
                    let selected = v.toLowerCase() === initialValue.toLowerCase() ? 'selected' : '';
                    return `<option value="${v}" ${selected}>${v}</option>`;
                }).join('')}
            </select>
            <span class="remove" onclick="removeFilter('${col}', this)">×</span>`;
        document.getElementById('dynamicFilters').appendChild(tag);
        activeDynamicFilters[col] = initialValue || "";
        applyFilters();
    }

    window.updateDynFilter = (col, val) => { activeDynamicFilters[col] = val; applyFilters(); };

    window.removeFilter = (col, el) => {
        const parentTag = el.parentElement;
        const linkedWord = parentTag.dataset.linkedWord ? parentTag.dataset.linkedWord.toLowerCase() : '';
        delete activeDynamicFilters[col]; 
        parentTag.remove(); 

        if(linkedWord.length > 0) {
            let currentSearch = attrInput.value;
            let regex = new RegExp('(\\??\\s*' + escapeRegExp(linkedWord) + '\\b|\\b' + escapeRegExp(linkedWord) + '\\b\\s*\\??)', 'gi');
            attrInput.value = currentSearch.replace(regex, '').replace(/\s+/g, ' ').trim();
        }
        applyFilters(); 
    };

    function applyFilters() {
        if (db.length === 0) { renderTable([], []); return; }

        const globalVal = attrInput.value.toLowerCase();
        const searchNames = globalVal.startsWith('?');
        const terms = (searchNames ? globalVal.substring(1) : globalVal).split(/[\s?]+/).filter(t => t.length > 0);
        const plantNameVal = plantNameInput.value.toLowerCase().trim();

        const userMinInches = hMinInput.value ? Math.max(0, parseInt(hMinInput.value, 10)) * 12 : 0;
        const userMaxInches = hMaxInput.value ? Math.max(0, parseInt(hMaxInput.value, 10)) * 12 : 999999;

        const fLight = document.getElementById('f-light').value;
        const fFoliage = document.getElementById('f-foliage').value;
        const fCategory = document.getElementById('f-category').value; // Lectura del valor del combo box Category

        const skipRoses = document.getElementById('chkSkipRoses').checked;
        const skipFruit = document.getElementById('chkSkipFruit').checked;

        let dynamicColsToRender = new Set();
        for(let col in activeDynamicFilters) {
            if(activeDynamicFilters[col]) dynamicColsToRender.add(col);
        }

        const filtered = db.filter(p => {
            const commonName = String(p[mappedCols.common_name] || '').toLowerCase();
            const botanicalName = String(p[mappedCols.botanical_name] || '').toLowerCase();
            const combinedNames = commonName + " " + botanicalName;

            if (skipRoses && combinedNames.includes('rose')) return false;
            if (skipFruit && combinedNames.includes('fruit tree')) return false;
            if(plantNameVal.length > 0 && !combinedNames.includes(plantNameVal)) return false;

            // Filtro por combo box Category
            if(fCategory && p[mappedCols.category] !== fCategory) return false;

            if(terms.length > 0) {
                const targetText = searchNames ? combinedNames : Object.values(p).join(' ').toLowerCase();
                if(!terms.every(t => targetText.includes(t))) return false;
                terms.forEach(t => { if(attrToColumnMap[t]) dynamicColsToRender.add(attrToColumnMap[t]); });
            }

            for(let col in activeDynamicFilters) {
                if(activeDynamicFilters[col] && String(p[col]).toLowerCase() !== activeDynamicFilters[col].toLowerCase()) return false;
            }

            if(fLight && p[mappedCols.light] !== fLight) return false;
            if(fFoliage && p[mappedCols.foliage] !== fFoliage) return false;

            if(hMinInput.value || hMaxInput.value) {
                const plantHeight = parseHeightRange(p[mappedCols.height]);
                if(plantHeight.min < userMinInches || plantHeight.max > userMaxInches) return false;
            }
            return true;
        });

        document.getElementById('counterDisplay').innerText = `Plants: ${filtered.length} / ${db.length}`;
        renderTable(filtered, Array.from(dynamicColsToRender));
    }

    function renderTable(data, dynamicColumns) {
        const fixedHeaders = [
            { key: mappedCols.common_name, label: 'COMMON NAME' },
            { key: mappedCols.light, label: 'LIGHT' },
            { key: mappedCols.foliage, label: 'FOLIAGE' },
            { key: mappedCols.height, label: 'HEIGHT' }
        ];

        const thead = document.getElementById('tableHead');
        let headerHtml = '<tr>';
        fixedHeaders.forEach(h => headerHtml += `<th>${h.label}</th>`);
        dynamicColumns.forEach(col => {
            if(!Object.values(mappedCols).includes(col)) {
                headerHtml += `<th>${col.replace(/_/g, ' ').toUpperCase()}</th>`;
            }
        });
        headerHtml += '</tr>';
        thead.innerHTML = headerHtml;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map(p => {
            let rowHtml = `<tr class="data-row" onclick="showDetail('${p[mappedCols.common_name] || p[mappedCols.botanical_name]}', 'plant')">`;
            rowHtml += `<td>${p[mappedCols.common_name] || '---'}</td>`;
            rowHtml += `<td>${p[mappedCols.light] || '---'}</td>`;
            rowHtml += `<td>${p[mappedCols.foliage] || '---'}</td>`;
            rowHtml += `<td>${p[mappedCols.height] || '---'}</td>`;
            dynamicColumns.forEach(col => {
                if(!Object.values(mappedCols).includes(col)) {
                    rowHtml += `<td>${p[col] || '---'}</td>`;
                }
            });
            rowHtml += `</tr>`;
            return rowHtml;
        }).join('');
    }

    document.getElementById('btnNewSearch').addEventListener('click', () => {
        attrInput.value = "";
        plantNameInput.value = "";
        soilInput.value = "";
        hMinInput.value = "";
        hMaxInput.value = "";
        document.getElementById('chkSkipRoses').checked = false;
        document.getElementById('chkSkipFruit').checked = false;
        document.getElementById('f-light').value = "";
        document.getElementById('f-foliage').value = "";
        document.getElementById('f-category').value = ""; // CORRECCIÓN: Reinicio explícito de Category
        document.getElementById('dynamicFilters').innerHTML = "";
        activeDynamicFilters = {};
        lastSelectedFilters = { light: '', foliage: '' };
        closeDataSheet();
        applyFilters();
    });

    function showDetail(name, type) {
        if(!name) return;
        const sheet = document.getElementById('dataSheet');
        const contentArea = document.getElementById('ds-content');
        
        contentArea.innerHTML = ""; 

        if (type === 'plant') {
            const p = db.find(x => 
                (x[mappedCols.common_name]||'').toUpperCase() === name.toUpperCase() || 
                (x[mappedCols.botanical_name]||'').toUpperCase() === name.toUpperCase()
            );
            if(!p) return;
            
            sheet.className = "sheet-plant";
            sheet.style.display = 'block';
            document.getElementById('ds-name').innerText = `🌿 PLANT: ${(p[mappedCols.common_name] || p[mappedCols.botanical_name]).toUpperCase()}`;
            
            let groups = {
                identity: { title: "📋 Main Identity", html: "" },
                growth: { title: "🌱 Growth & Size", html: "" },
                requirements: { title: "☀️ Requirements", html: "" },
                additional: { title: "🌟 Additional Details", html: "" }
            };

            Object.keys(p).forEach(k => {
                let keyLower = k.toLowerCase();
                let val = p[k] || '---';
                let boxHtml = `<div class="info-box"><b>${k.replace(/_/g,' ')}</b><span>${val}</span></div>`;

                if(keyLower.includes('name') || keyLower.includes('botanical') || keyLower.includes('type') || keyLower.includes('id')) {
                    groups.identity.html += boxHtml;
                } else if(keyLower.includes('height') || keyLower.includes('size') || keyLower.includes('foliage') || keyLower.includes('growth') || keyLower.includes('spread')) {
                    groups.growth.html += boxHtml;
                } else if(keyLower.includes('light') || keyLower.includes('water') || keyLower.includes('soil') || keyLower.includes('zone') || keyLower.includes('requirement') || keyLower.includes('tolerat')) {
                    groups.requirements.html += boxHtml;
                } else {
                    groups.additional.html += boxHtml;
                }
            });

            let finalHtml = "";
            Object.keys(groups).forEach(gKey => {
                if(groups[gKey].html.length > 0) {
                    finalHtml += `<div class="info-group-box"><h3>${groups[gKey].title}</h3>${groups[gKey].html}</div>`;
                }
            });
            contentArea.innerHTML = finalHtml;

        } else if (type === 'soil') {
            const firstCol = Object.keys(soilDb[0])[0];
            const s = soilDb.find(x => String(x[firstCol]).toUpperCase() === name.toUpperCase());
            if(!s) return;

            sheet.className = "sheet-soil";
            sheet.style.display = 'block';
            document.getElementById('ds-name').innerText = `⏳ SOIL TYPE: ${String(s[firstCol]).toUpperCase()}`;

            let groups = {
                properties: { title: "🪵 Soil Properties & Type", html: "" },
                chemical: { title: "🧪 Chemistry & Components", html: "" }
            };

            Object.keys(s).forEach(k => {
                let keyLower = k.toLowerCase();
                let val = s[k] || '---';
                let boxHtml = `<div class="info-box"><b>${k.replace(/_/g,' ')}</b><span>${val}</span></div>`;

                if(keyLower.includes('ph') || keyLower.includes('nitrogen') || keyLower.includes('phosphorus') || keyLower.includes('potassium') || keyLower.includes('chemical')) {
                    groups.chemical.html += boxHtml;
                } else {
                    groups.properties.html += boxHtml;
                }
            });

            let finalHtml = "";
            Object.keys(groups).forEach(gKey => {
                if(groups[gKey].html.length > 0) {
                    finalHtml += `<div class="info-group-box"><h3>${groups[gKey].title}</h3>${groups[gKey].html}</div>`;
                }
            });
            contentArea.innerHTML = finalHtml;
        }
        sheet.scrollIntoView({behavior:'smooth'});
    }

    function closeDataSheet() {
        document.getElementById('dataSheet').style.display = 'none';
    }
</script>
