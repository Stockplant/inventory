<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant & Soil Expert System V23.0</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --neon: #39FF14; --bg: #0a0a0a; --panel: #151515; --text: #eee; --glow: 0 0 20px rgba(57, 255, 20, 0.6); }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .main-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .upload-zone { background: #1a1a1a; border: 2px dashed var(--neon); padding: 12px; text-align: center; border-radius: 12px; }
        
        .control-panel { background: var(--panel); padding: 15px; border-radius: 12px; border: 3px solid var(--neon); box-shadow: var(--glow); display: flex; flex-direction: column; gap: 12px; }
        
        /* Sistema de Grilla Horizontal Ultra-Compacto */
        .search-grid { display: flex; flex-direction: column; gap: 10px; }
        
        /* FILA SUPERIOR: Botón raíz, categoría pequeña y botón columnas + */
        .top-action-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        /* Combobox Categoría Pequeño y estilizado */
        .category-mini-select { max-width: 180px; padding: 6px 10px; font-size: 0.85rem; border: 1px solid var(--neon); background: #000; color: #fff; }
        .btn-col-help { background: #222; color: var(--neon); border: 1px solid var(--neon); padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 0.8rem; }

        /* FILA PRINCIPAL DE BUSCADORES: Alineación a la derecha */
        .search-inputs-row { display: flex; align-items: center; justify-content: flex-end; gap: 30px; width: 100%; flex-wrap: wrap; }
        
        /* Bloque Atributos */
        .attr-search-block { flex-grow: 1; min-width: 200px; position: relative; }
        .attr-input { width: 100%; box-sizing: border-box; border: 1px solid var(--neon); font-size: 0.95rem; padding: 10px; }
        
        /* Bloque Suelo (Reducido a 20% y empujado a la derecha) */
        .soil-search-block { width: 20%; min-width: 180px; position: relative; }
        .soil-input { width: 100%; box-sizing: border-box; border: 1px solid gold; font-size: 0.95rem; padding: 10px; }
        
        /* Buscador de Nombre de Planta (Reducido a 20% y empujado a la derecha) */
        .plant-name-block { width: 20%; min-width: 180px; position: relative; }
        .plant-input { width: 100%; box-sizing: border-box; border: 1px solid var(--neon); font-size: 0.95rem; padding: 10px; }

        /* FILA SUB-CONTROLES: Todo fluye continuamente de izquierda a derecha */
        .sub-controls-row { display: flex; width: 100%; background: #0c0c0c; padding: 8px; border-radius: 6px; box-sizing: border-box; }
        
        /* Contenedor unificado para filtros fijos y dinámicos alineados */
        .all-filters-wrapper { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; align-items: center; }
        
        /* Contenedores individuales corregidos (Fijos) */
        .filter-item-box { display: flex; flex-direction: column; gap: 2px; width: 110px; flex-shrink: 0; }
        .filter-item-box.height-box { width: 130px; }
        
        .filter-item-box label { font-size: 0.55rem; color: #888; text-transform: uppercase; }
        .filter-item-box input, .filter-item-box select { padding: 4px; font-size: 0.75rem; background: #000; border: 1px solid #444; color: #fff; width: 100%; box-sizing: border-box; }
        
        /* AREA DINÁMICA: Empieza justo después de Foliage sin estirarse */
        .dynamic-filters-area { display: flex; flex-wrap: wrap; gap: 12px; }

        /* Tags dinámicos con comportamiento idéntico a los fijos */
        .filter-tag { display: flex; flex-direction: column; gap: 2px; width: 120px; flex-shrink: 0; }
        .filter-tag .tag-label-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .filter-tag span { font-size: 0.55rem; color: var(--neon); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95px; }
        .filter-tag .remove { color: #ff4444; cursor: pointer; font-weight: bold; font-size: 0.75rem; line-height: 1; }
        .filter-tag select { padding: 4px; font-size: 0.75rem; border: 1px solid var(--neon); background: #000; color: white; width: 100%; box-sizing: border-box; border-radius: 5px; }

        /* Checkboxes y contador al final */
        .footer-panel-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; border-top: 1px solid #222; padding-top: 8px; }
        .checkbox-container { display: flex; gap: 15px; font-size: 0.8rem; color: #aaa; }
        .checkbox-container label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .checkbox-container input[type="checkbox"] { cursor: pointer; accent-color: var(--neon); }
        .counter-badge { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 6px 12px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; }

        input, select { background: #000; border: 1px solid #444; color: white; border-radius: 5px; outline: none; }
        input:focus, select:focus { border-color: var(--neon); }
        
        .btn-new-search { background: #ff4444; color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 5px; text-transform: uppercase; font-size: 0.75rem; }
        .btn-new-search:hover { background: #cc0000; }
        
        .floating-menu { position: absolute; top: 100%; left: 0; width: 100%; background: #111; border: 1px solid var(--neon); z-index: 1000; max-height: 200px; overflow-y: auto; display: none; }
        .menu-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #222; font-size: 0.8rem; }
        .menu-item:hover { background: var(--neon); color: black; }

        /* Ficha Técnica y Tablas */
        #dataSheet { border: 2px solid var(--neon); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: none; box-shadow: var(--glow); background: var(--panel); }
        .ds-title-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 8px; margin-bottom: 15px; }
        .btn-close-sheet { background: #ff4444; color: white; border: none; font-size: 1rem; font-weight: bold; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .groups-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .info-group-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; }
        .info-group-box h3 { margin-top: 0; color: var(--neon); font-size: 0.85rem; border-bottom: 1px solid #222; padding-bottom: 4px; text-transform: uppercase; }
        .info-box { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed #222; font-size: 0.8rem; }
        .info-box span:first-child { color: #aaa; }

        .results-area { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
        th { background: #1a1a1a; color: var(--neon); padding: 12px; text-align: left; font-size: 0.7rem; text-transform: uppercase; border-bottom: 2px solid #222; }
        td { padding: 10px 12px; border-bottom: 1px solid #222; font-size: 0.8rem; }
        tr.data-row:hover { background: #1a2e1a; cursor: pointer; }
        
        /* ----- AJUSTES SEGUROS PARA APILAMIENTO EN CELULARES ----- */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .control-panel { padding: 10px; gap: 10px; }
            .top-action-bar, .search-inputs-row, .sub-controls-row, .footer-panel-row { flex-direction: column; align-items: stretch; gap: 10px; }
            
            .category-mini-select, .attr-search-block, .soil-search-block, .plant-name-block { width: 100% !important; max-width: 100% !important; }
            .all-filters-wrapper { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
            .filter-item-box, .filter-item-box.height-box, .filter-tag, .dynamic-filters-area { width: 100% !important; }
            
            input, select, .btn-new-search, .btn-col-help { padding: 10px; font-size: 0.9rem; width: 100%; text-align: center; }
            .counter-badge { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="upload-zone" id="uploadZone">
        <label style="display:block; margin-bottom:8px; color:#aaa; font-size:0.85rem;">Upload files to begin (Plants and inf.xlsx for Soil):</label>
        <input type="file" id="inPlants"> <input type="file" id="inSoil">
    </div>

    <div class="control-panel" id="mainPanel" style="opacity:0.5;">
        <div class="search-grid">
            
            <!-- FILA ACCIONES SUPERIORES -->
            <div class="top-action-bar">
                <button class="btn-new-search" id="btnNewSearch">New Search</button>
                
                <select id="f-category" class="category-mini-select" onchange="applyFilters();">
                    <option value="">All Categories</option>
                </select>
                
                <button class="btn-col-help" id="btnHelp" title="Toggle Column Filters">Column +</button>
            </div>

            <!-- FILA PRINCIPAL: Atributos crece a la izquierda, Soil y Plant Name pequeños a la derecha -->
            <div class="search-inputs-row">
                <div class="attr-search-block">
                    <input type="text" id="attrFinder" class="attr-input" placeholder="Search attributes..." autocomplete="off">
                </div>

                <div class="soil-search-block">
                    <input type="text" id="soilFinder" class="soil-input" style="border-color: gold;" placeholder="Search soil (inf.xlsx)..." autocomplete="off">
                    <div id="soilMenu" class="floating-menu" style="border-color: gold;"></div>
                </div>

                <div class="plant-name-block">
                    <input type="text" id="plantNameFinder" class="plant-input" placeholder="Direct plant name search..." autocomplete="off">
                    <div id="plantNameMenu" class="floating-menu"></div>
                </div>
            </div>

            <!-- FILA SUB-CONTROLES UNIFICADA -->
            <div class="sub-controls-row">
                <div class="all-filters-wrapper">
                    <!-- Filtros Fijos -->
                    <div class="filter-item-box height-box">
                        <label>H.(Min/Max)</label>
                        <div style="display:flex; gap:2px;">
                            <input type="number" id="h-min" min="0" placeholder="Min" oninput="validateAndApplyHeight();">
                            <input type="number" id="h-max" min="0" placeholder="Max" oninput="validateAndApplyHeight();">
                        </div>
                    </div>
                    <div class="filter-item-box">
                        <label>Light</label>
                        <select id="f-light" onchange="syncStaticFilterToBox('light', this.value)"><option value="">All</option></select>
                    </div>
                    <div class="filter-item-box">
                        <label>Foliage</label>
                        <select id="f-foliage" onchange="syncStaticFilterToBox('foliage', this.value)"><option value="">All</option></select>
                    </div>

                    <!-- Filtros Dinámicos (Empiezan inmediatamente aquí al lado) -->
                    <div id="dynamicFilters" class="dynamic-filters-area"></div>
                </div>
            </div>

            <!-- FILA FINAL: Checkboxes y Contador -->
            <div class="footer-panel-row">
                <div class="checkbox-container">
                    <label><input type="checkbox" id="chkSkipRoses" onchange="applyFilters()"> Omitir Rosas</label>
                    <label><input type="checkbox" id="chkSkipFruit" onchange="applyFilters()"> Omitir Fruit Tree</label>
                </div>
                <div class="counter-badge" id="counterDisplay">Plants: 0 / 0</div>
            </div>

            <!-- Capa técnica oculta para menús flotantes compartidos -->
            <div style="position: relative; width: 100%; height: 0; margin: 0; padding: 0;">
                <div id="attrMenu" class="floating-menu"></div> 
                <div id="colMenu" class="floating-menu"></div> 
            </div>

        </div>
    </div>

    <!-- Ficha Técnica -->
    <div id="dataSheet">
        <div class="ds-title-container">
            <h2 id="ds-name" style="margin:0; font-size: 1.1rem;"></h2>
            <button class="btn-close-sheet" onclick="closeDataSheet()" title="Close Details">×</button>
        </div>
        <div class="groups-wrapper" id="ds-content"></div>
    </div>

    <!-- Tabla de resultados -->
    <div class="results-area">
        <table id="mainTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let db = [];
    let soilDb = [];
    let colNames = [];
    let attrSet = new Set();
    let attrToColumnMap = {}; 
    let activeDynamicFilters = {}; 

    let lastSelectedFilters = { light: '', foliage: '' };

    const mappedCols = {
        common_name: 'Common_Name',
        botanical_name: 'Botanical_Name',
        light: 'Light_Requirement',
        foliage: 'Foliage',
        height: 'Height',
        category: 'Category'
    };

    document.getElementById('inPlants').addEventListener('change', (e) => loadXls(e, 'plants'));
    document.getElementById('inSoil').addEventListener('change', (e) => loadXls(e, 'soil'));

    // Configuración de botón "New Search"
    document.getElementById('btnNewSearch').addEventListener('click', () => {
        document.getElementById('attrFinder').value = "";
        document.getElementById('soilFinder').value = "";
        document.getElementById('plantNameFinder').value = "";
        document.getElementById('h-min').value = "";
        document.getElementById('h-max').value = "";
        document.getElementById('f-light').value = "";
        document.getElementById('f-foliage').value = "";
        document.getElementById('f-category').value = "";
        document.getElementById('chkSkipRoses').checked = false;
        document.getElementById('chkSkipFruit').checked = false;
        document.getElementById('dynamicFilters').innerHTML = "";
        activeDynamicFilters = {};
        lastSelectedFilters = { light: '', foliage: '' };
        closeDataSheet();
        applyFilters();
    });

    function loadXls(e, type) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            if(type === 'plants') {
                attrSet.clear();
                attrToColumnMap = {};
                db = json.map(r => {
                    let n = {};
                    for (let k in r) {
                        let originalKey = k.trim();
                        n[originalKey] = r[k];
                        if(originalKey !== mappedCols.common_name && originalKey !== mappedCols.botanical_name && r[k] !== undefined && r[k] !== null) {
                            let valStr = String(r[k]).trim();
                            if(valStr.length > 0) {
                                attrSet.add(valStr);
                                attrToColumnMap[valStr.toLowerCase()] = originalKey; 
                            }
                        }
                    }
                    return n;
                });
                colNames = db.length > 0 ? Object.keys(db[0]) : [];
                setupStaticFilters();
                setupCategoryFilter();
            } else { 
                soilDb = json; 
            }
            
            if(db.length > 0) document.getElementById('mainPanel').style.opacity = "1";
            if(db.length > 0 && soilDb.length > 0) document.getElementById('uploadZone').style.display = 'none';
            applyFilters();
        };
        reader.readAsArrayBuffer(file);
    }

    function setupStaticFilters() {
        ['f-light','f-foliage'].forEach(id => {
            const col = id === 'f-light' ? mappedCols.light : mappedCols.foliage;
            const vals = [...new Set(db.map(p => p[col]))].filter(Boolean).sort();
            const sel = document.getElementById(id);
            sel.innerHTML = `<option value="">All</option>`;
            vals.forEach(v => sel.innerHTML += `<option value="${v}">${v}</option>`);
        });
    }

    function setupCategoryFilter() {
        const selCategory = document.getElementById('f-category');
        if (!selCategory) return;
        const uniqueCategories = [...new Set(db.map(p => p[mappedCols.category]))].filter(Boolean).sort();
        selCategory.innerHTML = '<option value="">All Categories</option>';
        uniqueCategories.forEach(cat => {
            selCategory.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    }

    function syncStaticFilterToBox(type, value) {
        let currentText = attrInput.value;
        let lastValue = lastSelectedFilters[type];

        if (lastValue) {
            let escapedLast = escapeRegExp(lastValue);
            let regex = new RegExp('(\\??\\s*' + escapedLast + '\\b|\\b' + escapedLast + '\\b\\s*\\??)', 'gi');
            currentText = currentText.replace(regex, '');
        }

        currentText = currentText.replace(/\?+/g, '?').replace(/\s+/g, ' ').trim();

        if (value) {
            let parts = currentText.split('?').map(p => p.trim()).filter(p => p.length > 0);
            if (!parts.some(p => p.toLowerCase() === value.toLowerCase())) {
                parts.push(value);
            }
            currentText = parts.join('?');
        }

        if(currentText.startsWith('?')) currentText = currentText.substring(1);
        if(currentText.endsWith('?')) currentText = currentText.slice(0, -1);

        attrInput.value = currentText;
        lastSelectedFilters[type] = value;
        applyFilters();
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    document.addEventListener('click', () => { closeAllMenus(); });
    document.addEventListener('keydown', (e) => { if(e.key === "Escape") closeAllMenus(); });
    function closeAllMenus() {
        document.getElementById('attrMenu').style.display = 'none';
        document.getElementById('colMenu').style.display = 'none';
        document.getElementById('soilMenu').style.display = 'none';
        document.getElementById('plantNameMenu').style.display = 'none';
    }

    const hMinInput = document.getElementById('h-min');
    const hMaxInput = document.getElementById('h-max');

    function validateAndApplyHeight() {
        if (hMinInput.value && parseFloat(hMinInput.value) < 0) hMinInput.value = 0;
        if (hMaxInput.value && parseFloat(hMaxInput.value) < 0) hMaxInput.value = 0;
        applyFilters();
    }

    function clearInputsExcept(activeInputId) {
        if(activeInputId !== 'attrFinder') {
            attrInput.value = "";
            lastSelectedFilters = { light: '', foliage: '' };
            document.getElementById('f-light').value = "";
            document.getElementById('f-foliage').value = "";
            hMinInput.value = "";
            hMaxInput.value = "";
            document.getElementById('dynamicFilters').innerHTML = "";
            activeDynamicFilters = {};
        }
        if(activeInputId !== 'plantNameFinder') document.getElementById('plantNameFinder').value = "";
        if(activeInputId !== 'soilFinder') document.getElementById('soilFinder').value = "";
    }

    const attrInput = document.getElementById('attrFinder');
    const attrMenu = document.getElementById('attrMenu');
    attrInput.addEventListener('click', (e) => e.stopPropagation());
    
    attrInput.addEventListener('input', () => {
        clearInputsExcept('attrFinder');
        const fullVal = attrInput.value.toLowerCase();
        
        if(lastSelectedFilters.light && !fullVal.includes(lastSelectedFilters.light.toLowerCase())) {
            document.getElementById('f-light').value = "";
            lastSelectedFilters.light = "";
        }
        if(lastSelectedFilters.foliage && !fullVal.includes(lastSelectedFilters.foliage.toLowerCase())) {
            document.getElementById('f-foliage').value = "";
            lastSelectedFilters.foliage = "";
        }

        for(let col in activeDynamicFilters) {
            let linkedTag = document.getElementById(`tag-container-${col.replace(/ /g, '_')}`);
            if(linkedTag) {
                let word = linkedTag.dataset.linkedWord.toLowerCase();
                if(word && !fullVal.includes(word)) {
                    delete activeDynamicFilters[col];
                    linkedTag.remove();
                }
            }
        }

        const normalizedVal = fullVal.replace(/\?/g, ' ');
        const parts = normalizedVal.split(/\s+/);
        let lastPart = parts[parts.length-1].trim();

        if(lastPart.length > 0) {
            if(attrToColumnMap[lastPart]) { autoTriggerDynamicFilter(attrToColumnMap[lastPart], lastPart); }
            const matches = Array.from(attrSet).filter(a => {
                const lowerA = a.toLowerCase();
                return lowerA.includes(lastPart) && !normalizedVal.includes(lowerA);
            }).slice(0, 8);

            attrMenu.innerHTML = matches.map(m => `<div class="menu-item s-suggestion" data-val="${m}">${m}</div>`).join('');
            attrMenu.style.display = matches.length ? 'block' : 'none';
        } else { attrMenu.style.display = 'none'; }
        applyFilters();
    });

    const soilInput = document.getElementById('soilFinder');
    const soilMenu = document.getElementById('soilMenu');
    soilInput.addEventListener('click', (e) => e.stopPropagation());
    soilInput.addEventListener('input', () => {
        clearInputsExcept('soilFinder');
        const val = soilInput.value.toLowerCase().trim();
        if(val.length > 0 && soilDb.length > 0) {
            const firstCol = Object.keys(soilDb[0])[0];
            const matches = soilDb.filter(s => String(s[firstCol] || '').toLowerCase().includes(val)).slice(0, 8);
            
            soilMenu.innerHTML = matches.map(s => {
                let display = s[firstCol];
                return `<div class="menu-item soil-opt-item" data-val="${display}">${display}</div>`;
            }).join('');
            soilMenu.style.display = matches.length ? 'block' : 'none';
        } else { soilMenu.style.display = 'none'; }
    });

    const plantNameInput = document.getElementById('plantNameFinder');
    const plantNameMenu = document.getElementById('plantNameMenu');
    plantNameInput.addEventListener('click', (e) => e.stopPropagation());
    plantNameInput.addEventListener('input', () => {
        clearInputsExcept('plantNameFinder');
        const val = plantNameInput.value.toLowerCase().trim();
        if(val.length > 0 && db.length > 0) {
            const matches = db.filter(p => 
                (p[mappedCols.common_name] || '').toLowerCase().includes(val) || 
                (p[mappedCols.botanical_name] || '').toLowerCase().includes(val)
            ).slice(0, 8);
            plantNameMenu.innerHTML = matches.map(p => {
                let display = p[mappedCols.common_name] || p[mappedCols.botanical_name];
                return `<div class="menu-item plant-suggestion" data-val="${display}">${display}</div>`;
            }).join('');
            plantNameMenu.style.display = matches.length ? 'block' : 'none';
        } else { plantNameMenu.style.display = 'none'; }
        applyFilters();
    });

    function autoTriggerDynamicFilter(col, value) {
        if(col === mappedCols.light) {
            let select = document.getElementById('f-light');
            let option = Array.from(select.options).find(o => o.value.toLowerCase() === value.toLowerCase());
            if(option) { select.value = option.value; lastSelectedFilters.light = option.value; applyFilters(); return; }
        }
        if(col === mappedCols.foliage) {
            let select = document.getElementById('f-foliage');
            let option = Array.from(select.options).find(o => o.value.toLowerCase() === value.toLowerCase());
            if(option) { select.value = option.value; lastSelectedFilters.foliage = option.value; applyFilters(); return; }
        }
        if(activeDynamicFilters[col] === undefined) { addFilterTag(col, value); }
    }

    document.getElementById('btnHelp').addEventListener('click', (e) => {
        e.stopPropagation();
        const menu = document.getElementById('colMenu');
        menu.innerHTML = colNames.map(c => `<div class="menu-item col-opt" data-col="${c}">${c.replace(/_/g,' ').replace(/([A-Z])/g, ' $1').trim().toUpperCase()}</div>`).join('');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', (e) => {
        if(e.target.classList.contains('s-suggestion')) {
            const val = e.target.dataset.val;
            const targetCol = attrToColumnMap[val.toLowerCase()];
            let rawInput = attrInput.value;
            let lastSpace = rawInput.lastIndexOf(' ');
            let lastQuestion = rawInput.lastIndexOf('?');
            let lastIndex = Math.max(lastSpace, lastQuestion);
            let base = lastIndex !== -1 ? rawInput.substring(0, lastIndex + 1) : '';
            attrInput.value = base + val;
            if(targetCol) { autoTriggerDynamicFilter(targetCol, val); }
            attrMenu.style.display = 'none';
            applyFilters();
        }
        
        if(e.target.classList.contains('soil-opt-item')) {
            const val = e.target.dataset.val;
            soilInput.value = val;
            soilMenu.style.display = 'none';
            applyFilters();
        }

        if(e.target.classList.contains('plant-suggestion')) {
            const targetPlantName = e.target.dataset.val;
            attrInput.value = "";
            soilInput.value = "";
            hMinInput.value = "";
            hMaxInput.value = "";
            document.getElementById('f-light').value = "";
            document.getElementById('f-foliage').value = "";
            document.getElementById('f-category').value = "";
            document.getElementById('dynamicFilters').innerHTML = "";
            activeDynamicFilters = {};
            lastSelectedFilters = { light: '', foliage: '' };
            plantNameInput.value = targetPlantName;
            plantNameMenu.style.display = 'none';
            applyFilters();
        }
        if(e.target.classList.contains('col-opt')) {
            addFilterTag(e.target.dataset.col, "");
            document.getElementById('colMenu').style.display = 'none';
        }
    });

    function addFilterTag(col, initialValue) {
        if(activeDynamicFilters[col] !== undefined) return;
        const vals = [...new Set(db.map(p => p[col]))].filter(Boolean).sort();
        const tag = document.createElement('div');
        tag.className = 'filter-tag';
        tag.id = `tag-container-${col.replace(/ /g, '_')}`;
        tag.dataset.linkedWord = initialValue; 

        tag.innerHTML = `
            <div class="tag-label-container">
                <span>${col.replace(/_/g,' ').toUpperCase()}</span>
                <span class="remove" onclick="removeFilter('${col}', this)">×</span>
            </div>
            <select id="sel-dyn-${col.replace(/ /g, '_')}" onchange="updateDynFilter('${col}', this.value)">
                <option value="">Any</option>
                ${vals.map(v => {
                    let selected = v.toLowerCase() === initialValue.toLowerCase() ? 'selected' : '';
                    return `<option value="${v}" ${selected}>${v}</option>`;
                }).join('')}
            </select>`;
        document.getElementById('dynamicFilters').appendChild(tag);
        activeDynamicFilters[col] = initialValue || "";
        applyFilters();
    }

    window.updateDynFilter = (col, val) => { activeDynamicFilters[col] = val; applyFilters(); };

    window.removeFilter = (col, el) => {
        const parentTag = el.closest('.filter-tag');
        const linkedWord = parentTag.dataset.linkedWord ? parentTag.dataset.linkedWord.toLowerCase() : '';
        delete activeDynamicFilters[col]; 
        parentTag.remove(); 

        if(linkedWord.length > 0) {
            let currentSearch = attrInput.value;
            let regex = new RegExp('(\\??\\s*' + escapeRegExp(linkedWord) + '\\b|\\b' + escapeRegExp(linkedWord) + '\\b\\s*\\??)', 'gi');
            attrInput.value = currentSearch.replace(regex, '').replace(/\s+/g, ' ').trim();
        }
        applyFilters(); 
    };

    // --- LOGICA DEL MOTOR DE BUSQUEDA RESTABLECIDA ---
    function applyFilters() {
        if (db.length === 0) return;

        const attrVal = document.getElementById('attrFinder').value.trim().toLowerCase();
        const soilVal = document.getElementById('soilFinder').value.trim().toLowerCase();
        const plantNameVal = document.getElementById('plantNameFinder').value.trim().toLowerCase();
        const catVal = document.getElementById('f-category').value;
        const minH = parseFloat(document.getElementById('h-min').value) || 0;
        const maxH = parseFloat(document.getElementById('h-max').value) || Infinity;
        const skipRoses = document.getElementById('chkSkipRoses').checked;
        const skipFruit = document.getElementById('chkSkipFruit').checked;

        let filtered = db.filter(p => {
            // Filtro Omitir Rosas
            if (skipRoses && String(p[mappedCols.common_name] || '').toLowerCase().includes('rose')) return false;
            // Filtro Omitir Fruit Trees
            if (skipFruit && String(p[mappedCols.category] || '').toLowerCase().includes('fruit tree')) return false;
            // Filtro Categoría Superior
            if (catVal && p[mappedCols.category] !== catVal) return false;

            // Filtro por Nombre Directo de Planta
            if (plantNameVal) {
                const cName = String(p[mappedCols.common_name] || '').toLowerCase();
                const bName = String(p[mappedCols.botanical_name] || '').toLowerCase();
                if (!cName.includes(plantNameVal) && !bName.includes(plantNameVal)) return false;
            }

            // Filtro por Altura
            const hVal = parseFloat(p[mappedCols.height]) || 0;
            if (hVal < minH || hVal > maxH) return false;

            // Filtro Estático: Light
            const lightSelect = document.getElementById('f-light').value;
            if (lightSelect && p[mappedCols.light] !== lightSelect) return false;

            // Filtro Estático: Foliage
            const foliageSelect = document.getElementById('f-foliage').value;
            if (foliageSelect && p[mappedCols.foliage] !== foliageSelect) return false;

            // Filtros Dinámicos de Columnas Adicionales (Column +)
            for (let col in activeDynamicFilters) {
                let requiredVal = activeDynamicFilters[col];
                if (requiredVal && p[col] !== requiredVal) return false;
            }

            // Filtro Avanzado Multi-Atributo por Espacios (?) o Normales
            if (attrVal) {
                const tokens = attrVal.replace(/\?/g, ' ').split(/\s+/).filter(t => t.length > 0);
                // Todas las palabras/tokens deben encontrarse en algún campo del registro
                for (let token of tokens) {
                    let tokenFound = false;
                    for (let key in p) {
                        if (String(p[key]).toLowerCase().includes(token)) {
                            tokenFound = true;
                            break;
                        }
                    }
                    if (!tokenFound) return false;
                }
            }

            // Filtro cruzado con archivo de Suelos (inf.xlsx)
            if (soilVal && soilDb.length > 0) {
                const firstSoilCol = Object.keys(soilDb[0])[0];
                const matchedSoilRows = soilDb.filter(s => String(s[firstSoilCol] || '').toLowerCase().includes(soilVal));
                
                if (matchedSoilRows.length > 0) {
                    let matchesAnySoilCriteria = false;
                    for (let sRow of matchedSoilRows) {
                        let rowMatch = true;
                        for (let sKey in sRow) {
                            if (sKey === firstSoilCol) continue;
                            let critVal = String(sRow[sKey] || '').trim().toLowerCase();
                            if (critVal.length > 0) {
                                // Buscar si la planta cumple con el criterio de esta columna de suelos
                                if (p[sKey] === undefined || !String(p[sKey]).toLowerCase().includes(critVal)) {
                                    rowMatch = false;
                                    break;
                                }
                            }
                        }
                        if (rowMatch) { matchesAnySoilCriteria = true; break; }
                    }
                    if (!matchesAnySoilCriteria) return false;
                }
            }

            return true;
        });

        // Actualizar contador visual
        document.getElementById('counterDisplay').innerText = `Plants: ${filtered.length} / ${db.length}`;

        // Construir Cabeceras y Renderizar Tabla
        renderTable(filtered);
    }

    function renderTable(data) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = "";
        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#666;">No plants match the criteria.</td></tr>`;
            return;
        }

        // Columnas principales a mostrar en la vista general compacta
        const headers = [mappedCols.common_name, mappedCols.botanical_name, mappedCols.category, mappedCols.light];
        
        // Crear cabecera HTML
        let headRow = "<tr>";
        headers.forEach(h => {
            headRow += `<th>${h.replace(/_/g, ' ')}</th>`;
        });
        headRow += "</tr>";
        thead.innerHTML = headRow;

        // Crear filas de datos
        data.forEach((plant, index) => {
            const tr = document.createElement('tr');
            tr.className = "data-row";
            tr.innerHTML = headers.map(h => `<td>${plant[h] || '-'}</td>`).join('');
            tr.addEventListener('click', () => openDataSheet(plant));
            tbody.appendChild(tr);
        });
    }

    // --- LÓGICA DE LA FICHA TÉCNICA DETALLADA ---
    function openDataSheet(plant) {
        const sheet = document.getElementById('dataSheet');
        const title = document.getElementById('ds-name');
        const content = document.getElementById('ds-content');

        title.innerText = plant[mappedCols.common_name] || plant[mappedCols.botanical_name] || "Plant Details";
        content.innerHTML = "";

        // Dividir las columnas en grupos lógicos de 5 elementos para una organización visual balanceada
        let currentBox = null;
        let count = 0;

        colNames.forEach((col) => {
            if (plant[col] === undefined || plant[col] === null || String(plant[col]).trim() === "") return;

            if (count % 5 === 0) {
                currentBox = document.createElement('div');
                currentBox.className = 'info-group-box';
                currentBox.innerHTML = `<h3>Data Group ${Math.floor(count/5) + 1}</h3>`;
                content.appendChild(currentBox);
            }

            const infoBox = document.createElement('div');
            infoBox.className = 'info-box';
            infoBox.innerHTML = `<span>${col.replace(/_/g, ' ')}:</span> <span>${plant[col]}</span>`;
            currentBox.appendChild(infoBox);
            count++;
        });

        sheet.style.display = "block";
        sheet.scrollIntoView({ behavior: 'smooth' });
    }

    function closeDataSheet() {
        document.getElementById('dataSheet').style.display = "none";
    }
</script>
